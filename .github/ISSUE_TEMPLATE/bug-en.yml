name: Bug report (English)
description: Report one reproducible problem in RAIL Studio.
body:
  - type: markdown
    attributes:
      value: "This report is public. Do not attach projects, scripts, crash dumps or secrets. Review logs and screenshots before sharing."
  - type: input
    id: build
    attributes:
      label: RAIL version and build
      description: Use Help > Copy Report Info. Do not include your project path.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Read these from Windows Settings > System > About.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number the steps; a screenplay is not required.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options: [Every time, Sometimes, Once, Not checked again]
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Addons and additional context
      description: State whether addons are enabled, and whether the issue occurs in a new project. Include only reviewed, non-sensitive evidence.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public information
      options:
        - label: I reviewed this report and its attachments for private content.
          required: true
